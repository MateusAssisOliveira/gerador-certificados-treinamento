  <span class="workflow-counter" aria-live="polite">Etapa 1 de 3 · Certificado</span>

  <button type="button" class="rail-btn tab-btn" data-tab="tabGeracao" aria-controls="tabGeracao"><span class="step-number">03</span><span class="rail-label">Gerar e baixar</span></button>
</nav>
