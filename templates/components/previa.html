{% raw %}
<section class="preview-panel">
      <div class="preview-header">
        <div class="preview-title-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="preview-header-svg">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
          <h2>Prévia do certificado</h2>
          <span class="preview-badge" id="previewSheetBadge">A4 Vertical (Retrato)</span>
        </div>

        <div class="preview-actions">
          <div class="quick-orientation-toggle">
            <button type="button" class="btn-orient-toggle active" id="btnOrientRetrato" title="A4 Retrato (Vertical)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="orient-svg"><rect x="6" y="3" width="12" height="18" rx="2"></rect></svg>
              <span>Vertical</span>
            </button>
            <button type="button" class="btn-orient-toggle" id="btnOrientPaisagem" title="A4 Paisagem (Horizontal)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="orient-svg"><rect x="3" y="6" width="18" height="12" rx="2"></rect></svg>
              <span>Horizontal</span>
            </button>
          </div>

          <button class="btn btn-sm btn-secondary" id="btnImprimirNavegador" title="Imprimir certificado">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="btn-icon">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            <span>Imprimir Certificado</span>
          </button>
        </div>
      </div>

      <details class="preview-settings"><summary>Opções de visualização</summary><div class="drawer-top-bar">
          <div class="drawer-subgroup">
            <span class="drawer-label">Face</span>
            <div class="preview-face-toggle" id="previewFaceToggle">
              <button type="button" class="btn-face-toggle active" id="btnVerFrente" title="Folha da frente">Frente</button>
              <button type="button" class="btn-face-toggle" id="btnVerVerso" title="Folha do verso">Verso</button>
              <button type="button" class="btn-face-toggle" id="btnVerAmbos" title="Ambas as folhas">Ambos</button>
            </div>
          </div>

          <div class="drawer-subgroup">
            <span class="drawer-label">Dados</span>
            <div class="preview-mode-toggle">
              <button type="button" class="btn-preview-mode" id="btnModoTags">Tags</button>
              <button type="button" class="btn-preview-mode active" id="btnModoSimulado">Preenchido</button>
            </div>
          </div>
        </div><div class="preview-person-select-wrapper" id="wrapperSelectPerson">
          <div class="person-select-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="person-select-icon">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Aluno na Prévia:</span>
          </div>
          <select id="selectParticipantePreview" class="form-select form-select-sm">
            <!-- Participantes preenchidos dinamicamente -->
          </select>
        </div></details><!-- ÁREA DE RENDERIZAÇÃO DA FOLHA A4 -->
      <div class="certificate-viewport view-mode-frente" id="certificateViewport">

        <!-- FOLHA 1: FRENTE DO CERTIFICADO -->
        {% endraw %}
{% include "components/certificado_frente.html" %}
{% raw %}<!-- FOLHA 2: VERSO DO CERTIFICADO (PARTE DE TRÁS / EMENTA & REGISTRO) -->
        {% endraw %}
{% include "components/certificado_verso.html" %}
{% raw %}</div>
    </section>
{% endraw %}
