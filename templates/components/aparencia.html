{% raw %}
<details class="workspace-details" id="tabDesign"><summary>Aparência e orientação</summary><div class="details-content">
<div class="section-card">
            <div class="card-header">
              <h2>Paleta Visual do Certificado</h2>
              <p>Escolha o estilo estético das bordas, fontes e cores que serão aplicadas no documento final.</p>
            </div>

            <div class="themes-grid">
              <label class="theme-card active">
                <input type="radio" name="radioTema" value="ouro_azul" checked>
                <div class="theme-preview ouro_azul">
                  <div class="theme-bar primary"></div>
                  <div class="theme-bar secondary"></div>
                </div>
                <div class="theme-info">
                  <strong>Ouro Real &amp; Azul Marinho</strong>
                  <span>Corporativo, elegante e clássico</span>
                </div>
              </label>

              <label class="theme-card">
                <input type="radio" name="radioTema" value="esmeralda">
                <div class="theme-preview esmeralda">
                  <div class="theme-bar primary"></div>
                  <div class="theme-bar secondary"></div>
                </div>
                <div class="theme-info">
                  <strong>Verde Esmeralda Nobre</strong>
                  <span>Acadêmico, sustentável e distinto</span>
                </div>
              </label>

              <label class="theme-card">
                <input type="radio" name="radioTema" value="classico">
                <div class="theme-preview classico">
                  <div class="theme-bar primary"></div>
                  <div class="theme-bar secondary"></div>
                </div>
                <div class="theme-info">
                  <strong>Clássico Minimalista</strong>
                  <span>Monocromático sóbrio e moderno</span>
                </div>
              </label>

              <label class="theme-card">
                <input type="radio" name="radioTema" value="rubi">
                <div class="theme-preview rubi">
                  <div class="theme-bar primary"></div>
                  <div class="theme-bar secondary"></div>
                </div>
                <div class="theme-info">
                  <strong>Rubi Imperial &amp; Dourado</strong>
                  <span>Solene, festivo e caloroso</span>
                </div>
              </label>
            </div>

            <div class="card-header mt-4">
              <h2>Orientação do Documento</h2>
            </div>
            <div class="orientation-selector">
              <label class="orientation-card active">
                <input type="radio" name="radioOrientacao" value="paisagem" checked>
                <div class="orientation-icon landscape">
                  <div class="inner-sheet"></div>
                </div>
                <span>Paisagem (A4 Horizontal - Padrão)</span>
              </label>
              <label class="orientation-card">
                <input type="radio" name="radioOrientacao" value="retrato">
                <div class="orientation-icon portrait">
                  <div class="inner-sheet"></div>
                </div>
                <span>Retrato (A4 Vertical)</span>
              </label>
            </div>

            </div>
</div></details>
{% endraw %}
